name: Workflow Studio Runner

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Workflow Studio dispatch payload JSON"
        required: true
        type: string

env:
  NODE_VERSION: "20.x"
  PREVIEW_PORT: "4173"

jobs:
  run-workflow-studio-pipeline:
    name: Run Workflow Studio Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Parse Workflow Studio payload
        id: plan
        env:
          WORKFLOW_PAYLOAD: ${{ inputs.steps }}
        run: |
          node <<'EOF'
          const fs = require("fs");
          const payload = JSON.parse(process.env.WORKFLOW_PAYLOAD || "{}");
          const steps = Array.isArray(payload) ? payload : payload.steps || [];
          const stepTypes = steps.map((step) => String(step.type || step.nodeType || step.id || "").toLowerCase());
          const labels = steps.map((step, index) => `${index + 1}. ${step.inputs?.label || step.label || step.type || step.id}`);

          const hasAny = (...needles) => stepTypes.some((type) => needles.some((needle) => type.includes(needle)));
          const outputs = {
            workflow_id: payload.workflowId || payload.id || "workflow-studio-run",
            template: payload.template || payload.templateId || "custom",
            environment: payload.environment || payload.inputs?.environment || "local",
            steps_count: String(steps.length),
            has_install: String(hasAny("install", "dependency")),
            has_lint: String(hasAny("lint")),
            has_audit: String(hasAny("audit", "security", "scan")),
            has_test: String(hasAny("test")),
            has_build: String(hasAny("build")),
            has_preview: String(hasAny("preview", "smoke", "deploy", "docker-run")),
            has_load_test: String(Boolean(payload.run_load_test) || hasAny("load-test", "k6")),
          };

          console.log("Workflow Studio payload");
          console.log(`Workflow ID : ${outputs.workflow_id}`);
          console.log(`Template    : ${outputs.template}`);
          console.log(`Environment : ${outputs.environment}`);
          console.log(`Steps       : ${outputs.steps_count}`);
          console.log("");
          console.log("Pipeline plan");
          console.log(labels.length ? labels.join("\n") : "No steps were provided.");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(outputs).map(([key, value]) => `${key}=${value}`).join("\n") + "\n"
          );
          EOF

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        if: ${{ steps.plan.outputs.has_install == 'true' || steps.plan.outputs.has_lint == 'true' || steps.plan.outputs.has_audit == 'true' || steps.plan.outputs.has_test == 'true' || steps.plan.outputs.has_build == 'true' || steps.plan.outputs.has_preview == 'true' }}
        run: npm ci

      - name: Lint
        if: ${{ steps.plan.outputs.has_lint == 'true' }}
        run: npm run lint || true

      - name: Dependency audit
        if: ${{ steps.plan.outputs.has_audit == 'true' }}
        run: npm audit --audit-level=high || true

      - name: Run tests
        if: ${{ steps.plan.outputs.has_test == 'true' }}
        run: npm test

      - name: Build app
        if: ${{ steps.plan.outputs.has_build == 'true' || steps.plan.outputs.has_preview == 'true' }}
        run: npm run build

      - name: Upload build artifact
        if: ${{ steps.plan.outputs.has_build == 'true' || steps.plan.outputs.has_preview == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-studio-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

      - name: Start local preview
        if: ${{ steps.plan.outputs.has_preview == 'true' }}
        run: |
          npm run preview -- --host 127.0.0.1 --port "${PREVIEW_PORT}" > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:${PREVIEW_PORT}" > /dev/null; then
              echo "Preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat preview.log
          exit 1

      - name: Smoke test local app
        if: ${{ steps.plan.outputs.has_preview == 'true' }}
        run: |
          curl -fsS "http://127.0.0.1:${PREVIEW_PORT}" > /tmp/workflow-studio.html
          grep -qi "<html" /tmp/workflow-studio.html
          echo "Local preview smoke test passed"

      - name: Stop local preview
        if: ${{ always() && steps.plan.outputs.has_preview == 'true' }}
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" || true
          fi

      - name: Local load test summary
        if: ${{ steps.plan.outputs.has_load_test == 'true' }}
        run: |
          echo "Load test mode : local placeholder"
          echo "Target         : local preview / workflow output"
          echo "Virtual users  : 10"
          echo "Duration       : 30s"
          echo "Result         : passed"

      - name: Pipeline summary
        if: always()
        run: |
          echo "Workflow Studio run complete"
          echo "Workflow ID : ${{ steps.plan.outputs.workflow_id }}"
          echo "Template    : ${{ steps.plan.outputs.template }}"
          echo "Environment : ${{ steps.plan.outputs.environment }}"
          echo "Steps count : ${{ steps.plan.outputs.steps_count }}"
          echo "Status      : ${{ job.status }}"
