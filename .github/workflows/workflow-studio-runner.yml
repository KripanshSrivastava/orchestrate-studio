name: Workflow Studio Runner

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Steps JSON string"
        required: true
        type: string

jobs:
  run-steps:
    runs-on: ubuntu-latest
    steps:
      - name: Print input
        run: |
          echo "Raw steps input: ${{ inputs.steps }}"

      - name: Parse JSON and run steps
        env:
          STEPS: ${{ inputs.steps }}
        run: |
          node -e "const payload = JSON.parse(process.env.STEPS || '{}'); const steps = payload.steps || []; for (const step of steps) { console.log('Running ' + step.id); }"

